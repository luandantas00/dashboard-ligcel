// ---------- Receita (dono): melhores meses e oportunidade de meta ----------
function recMes(mk, f) { let r = 0, q = 0, fr = 0; for (const x of S.data.R) { if (x[0] !== mk) continue; if (f && !f(x)) continue; r += x[8]; q += x[6]; fr += x[7]; } return { r, q, f: fr }; }
function sugestao() {
  const D = S.data, ms = D.M, cres = +S.cfg.cres || 0, K = kFactor();
  const completo = m => (D.D[m] || 0) >= monthDays(m);
  let ref = ms.filter(completo); if (!ref.length) ref = ms.slice();
  const C = {}; for (const x of D.R) { const key = x[0] + '|' + x[1] + '|' + x[3]; C[key] = (C[key] || 0) + x[8]; }
  const g = (m, li, k) => C[m + '|' + li + '|' + k] || 0;
  const dm = monthDays(S.mk), dd = Math.min(D.D[S.mk] || dm, dm), pk = dd < dm ? dm / dd : 1, aberto = pk > 1 && !ref.includes(S.mk), cand = aberto ? ref.concat([S.mk]) : ref;
  const val = (m, li, k) => g(m, li, k) * (m === S.mk && aberto ? pk : 1);
  const best = {}, potI = {}, potL = {};
  for (const k of FRK) potI[k] = 0;
  D.L.forEach((l, li) => { potL[li] = 0; best[li] = {}; for (const k of FRK) { let b = { v: 0, m: null }; for (const m of cand) { const v = val(m, li, k); if (v > b.v) b = { v, m }; } best[li][k] = b; potL[li] += b.v; potI[k] += b.v; } });
  const pot = Object.values(potL).reduce((s, x) => s + x, 0), f = 1 + cres;
  const mesTot = m => FRK.reduce((s, k) => s + D.L.reduce((t, _, li) => t + g(m, li, k), 0), 0);
  let bestM = { v: 0, m: null }; for (const m of cand) { const v = mesTot(m) * (m === S.mk && aberto ? pk : 1); if (v > bestM.v) bestM = { v, m }; }
  return { D, ms, ref, g, best, potI, potL, pot, f, cres, K, sug: pot * f, bestM, mesTot, aberto };
}

// ---------- sugestão de metas por indicador e loja (receita, franquia, quantidade, ticket) ----------
function sugDet() {
  const Z = sugestao(), D = S.data, f = Z.f, B = model();
  const dm = monthDays(S.mk), dd = Math.min(D.D[S.mk] || dm, dm), pk = dd < dm ? dm / dd : 1;
  const cel = {}; // li|k -> {r,f,q,m}
  D.L.forEach((_, li) => { for (const k of FRK) {
    const b = Z.best[li][k]; let r = 0, fr = 0, q = 0;
    if (b.m) { const m = b.m === S.mk && Z.aberto ? pk : 1; for (const x of D.R) if (x[0] === b.m && x[1] === li && x[3] === k) { q += x[6] * m; fr += x[7] * m; r += x[8] * m; } }
    cel[li + '|' + k] = { r: r * f, f: fr * f, q: q * f, m: b.m, tk: q > 0 ? r / q : 0, fm: q > 0 ? fr / q : 0 };
  } });
  const sum = (lis, ks) => { const o = { r: 0, f: 0, q: 0 }; for (const li of lis) for (const k of ks) { const c = cel[li + '|' + k]; o.r += c.r; o.f += c.f; o.q += c.q; } o.tk = o.q > 0 ? o.r / o.q : 0; o.fm = o.q > 0 ? o.f / o.q : 0; return o; };
  return { Z, B, cel, sum, lis: D.L.map((_, i) => i) };
}
function viewSug() {
  const X = sugDet(), { Z, B, cel, sum, lis } = X, D = S.data, op = S.openSug || (S.openSug = {});
  const tkt = ticketMap(B);

  const head = '<th>Receita sugerida</th><th>Franquia sugerida</th><th>Quantidade (vendas)</th><th>Ticket médio de comissão</th><th>Franquia média</th><th>Meta atual (receita)</th><th>Meta atual (vendas)</th>';
  const cells = (o, metaR, metaQ) => `<td><b>${brl(o.r)}</b></td><td>${brl(o.f)}</td><td><b>${Math.ceil(o.q)}</b></td><td>${o.tk ? brl2(o.tk) : '—'}</td><td>${o.fm ? brl2(o.fm) : '—'}</td><td>${brl(metaR)}</td><td>${metaQ}</td>`;

    if (open) iRows += `<tr class="dtl"><td colspan="8"><table class="pt"><thead><tr><th>Loja</th>${head}<th>Melhor mês</th></tr></thead><tbody>${D.L.map((l, li) => { const c = cel[li + '|' + k], bl = B.lojas.find(z => z.li === li), mr = bl ? bl.meta[k] : 0, t = tkt[k]; return `<tr><td class="name"><b>${esc(l)}</b></td>${cells(c, mr, t > 0 ? Math.ceil(mr / t) : 0)}<td>${c.m ? mlabel(c.m) : '—'}</td></tr>`; }).join('')}</tbody></table></td></tr>`;
  }
  const tot = sum(lis, FRK), metaTot = B.empresa.mTot, mqTot = FRK.reduce((a, k) => a + (tkt[k] > 0 ? Math.ceil(B.empresa.ind[k].meta / tkt[k]) : 0), 0);

    if (open) lRows += `<tr class="dtl"><td colspan="8"><table class="pt"><thead><tr><th>Indicador</th>${head}<th>Melhor mês</th></tr></thead><tbody>${FRK.map(k => { const c = cel[li + '|' + k], mm = bl ? bl.meta[k] : 0, t = tkt[k]; return `<tr><td class="name"><b>${INDN[k]}</b></td>${cells(c, mm, t > 0 ? Math.ceil(mm / t) : 0)}<td>${c.m ? mlabel(c.m) : '—'}</td></tr>`; }).join('')}</tbody></table></td></tr>`;

  return `<section class="panel"><header><h2>Sugestão de metas por indicador e loja</h2><span class="n">Base: o melhor mês fechado de cada loja em cada indicador (${Z.ref.map(mlabel).join(', ')}) + ${pc1(Z.cres)} de crescimento. Quantidade = vendas do melhor mês × crescimento; ticket médio de comissão = receita ÷ vendas; franquia média = franquia ÷ vendas. Clique na linha para abrir.</span></header>

// ---------- Simulador de comissão (vendedor, gerente e dono) ----------
function simcList(B) {
  const out = [];
  for (const l of B.lojas) {
    out.push({ key: 'G|' + l.nome, label: 'Gerente · ' + l.nome, kind: 'g', meta: l.meta, metaAp: l.metaAp, real: l.real, ap: l.ap, res: l.res, loja: l });
    for (const v of l.vends.filter(x => x.w > 0 || x.res.total > 0)) out.push({ key: 'V|' + v.nome, label: v.nome + (isDono() ? ' · ' + l.nome : ''), kind: 'v', meta: v.meta, metaAp: v.metaAp, real: v.real, ap: v.ap, res: v.res, loja: l });
  }
  return out;
}
function simcLoad(B, key, preset) {
  const lst = simcList(B), s = lst.find(x => x.key === key) || lst[0]; if (!s) return;
  const tkt = ticketMap(B), MQ = {}, V = {}, mm = {};
  for (const k of FRK) { const x = s.res.ind[k]; MQ[k] = tkt[k] > 0 ? Math.ceil((s.meta[k] || 0) / tkt[k]) : 0; V[k] = preset != null ? Math.round(MQ[k] * preset / 100) : Math.round(x.q); mm[k] = x.f > 0 ? Math.round(x.fm / x.f * 100) : 0; }
  const ma = Math.round(s.metaAp || 0);
  S.simc = { who: s.key, meta: MQ, vend: V, mm, svq: Math.round(s.res.ind.servico.q), ma, fa: preset != null ? Math.round(ma * preset / 100) : Math.round(s.res.ap.fat) };
}
function viewSimc() {
  const B = model(1), lst = simcList(B);
  if (!lst.length) return '<div class="empty">Sem vendedores neste mês.</div>';

  const s = lst.find(x => x.key === S.simc.who), cfg = S.cfg, tkt = ticketMap(B), MQ = S.simc.meta, V = S.simc.vend, MM = S.simc.mm, kind = s.kind, sc = cfg.esc.fr;

  const tkAp = s.ap && s.ap.q > 0 ? s.ap.fat / s.ap.q : B.totAp.q > 0 ? B.totAp.fat / B.totAp.q : 0, fatAp = Math.max(0, +S.simc.fa || 0), metaApS = Math.max(0, +S.simc.ma || 0);
  const sim = calcScope(real, { fat: fatAp, q: tkAp > 0 ? fatAp / tkAp : 0 }, metaS, metaApS, cfg, kind, servLiberado());

function carregarSimV(vendNome) {
  const B = model(1); const v = B.vends.find(x => x.nome === vendNome); if (!v) return;
  const l = B.lojas.find(x => x.nome === v.loja);
  const rho = {}; for (const ik of FRK) { const a = v.real[ik]; const b = l.real[ik], c = B.tot[ik]; rho[ik] = a && a.r > 0 ? a.f / a.r : b && b.r > 0 ? b.f / b.r : c.r > 0 ? c.f / c.r : 0; }
  const inD = {}; for (const { k } of IND) inD[k] = { meta: Math.round(v.meta[k] * 100) / 100, real: Math.round(((v.real[k] || {}).r || 0) * 100) / 100 };
  S.simV = { vend: vendNome, rho, in: inD, ap: { meta: Math.round(v.metaAp * 100) / 100, real: Math.round(((v.ap || {}).fat || 0) * 100) / 100 }, out: null, base: v.res.total };
}
function calcSimV() {
  const s = S.simV, meta = {}, real = {};
  for (const { k } of IND) { meta[k] = +s.in[k].meta || 0; const r = +s.in[k].real || 0; real[k] = { f: k === 'servico' ? 0 : r * (s.rho[k] || 0), r, q: 0 }; }
  s.out = calcScope(real, { fat: +s.ap.real || 0, q: 0 }, meta, +s.ap.meta || 0, S.cfg, 'v', servLiberado());
}

function aplicarSug() {
  if (!isDono()) return;
  const Z = sugestao(), M = metaW(), ks = FRK.slice(); M.mix.servico = 0;
  M.total = Math.max(0, Math.round(Z.sug / 1000) * 1000);
  const tot = ks.reduce((s, k) => s + Z.potI[k], 0) || 1; let acc = 0;
  ks.forEach((k, i) => { M.mix[k] = i < ks.length - 1 ? Math.round(Z.potI[k] / tot * 100) : 100 - acc; acc += M.mix[k]; });
  M.lojaPct = M.lojaPct || {}; let ac2 = 0; const L = Z.D.L;
  L.forEach((l, li) => { M.lojaPct[l] = li < L.length - 1 ? Math.round((Z.potL[li] / tot) * 1000) / 10 : Math.round((100 - ac2) * 10) / 10; ac2 += M.lojaPct[l]; });
  saveDono(); say('Meta de ' + mlabel(S.mk) + ' atualizada pela sugestão. Revise em Metas e custo e publique.');
}
/* A meta do Comissão e Meta é a base: dela saem as quantidades do Ritmo Comercial e do Minha Meta. */
async function metasParaRitmo(silencioso) {
  if (!isDono() || !(parent.__painel && parent.__painel.ritmoSalvarCfg)) return;
  const nz = x => String(x || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toUpperCase().replace(/\s+/g, ' ').trim();
  const B = model(), M = B.M; if (!(M && M.total > 0)) { if (!silencioso) say('Defina primeiro a meta total deste mês em Metas.'); return; }
  const cfgR = JSON.parse(JSON.stringify(parent.__painel.ritmoCfg() || {})); cfgR.metas = cfgR.metas || {};
  const nomes = {}; Object.keys(cfgR.metas).forEach(k => { const n = k.split('|')[1]; if (n) nomes[nz(n).slice(0, 6)] = n; });
  const tk = ticketMap(B), apT = B.totAp && B.totAp.q > 0 ? B.totAp.fat / B.totAp.q : 0, ID = { controle: 'CONTROLE', pos: 'POS', bl: 'BL', tv: 'TV' };
  let n = 0, sem = [];
  for (const l of B.lojas) {
    const nm = nomes[nz(S.data.L[l.li]).slice(0, 6)]; if (!nm) { sem.push(S.data.L[l.li]); continue; }
    for (const k of FRK) { const q = tk[k] > 0 ? Math.ceil((l.meta[k] || 0) / tk[k]) : 0; const key = S.mk + '|' + nm + '|' + ID[k]; if (q > 0) cfgR.metas[key] = q; else delete cfgR.metas[key]; n++; }
    const qa = apT > 0 ? Math.ceil((l.metaAp || 0) / apT) : 0, ka = S.mk + '|' + nm + '|AP'; if (qa > 0) cfgR.metas[ka] = qa; else delete cfgR.metas[ka];
  }
  try {
    if (parent.__painel.aparelhosMetas) { /* mesma meta de aparelho (unidades e receita) para o app Aparelhos e Chip */
      const lj = await parent.__painel.aparelhosLojas(), q = {}, r = {};
      for (const l of B.lojas) { const nmC = S.data.L[l.li], nmA = lj.find(x => nz(x).slice(0, 6) === nz(nmC).slice(0, 6)) || nmC; r[nmA] = Math.round(l.metaAp || 0); q[nmA] = apT > 0 ? Math.ceil((l.metaAp || 0) / apT) : 0; }
      await parent.__painel.aparelhosMetas(S.mk, q, r);
    }
    await parent.__painel.ritmoSalvarCfg(cfgR); if (!silencioso) say('Metas de ' + mlabel(S.mk) + ' enviadas ao Ritmo Comercial, Minha Meta e Aparelhos e Chip (quantidades = meta em R$ ÷ ticket médio).' + (sem.length ? ' Sem correspondência no Ritmo: ' + sem.join(', ') + '.' : '')); }
  catch (e) { if (!silencioso) say('Não consegui enviar ao Ritmo: ' + (e && e.message || e)); }
}
async function publicarAcesso() {

async function lerXlsx(file) {
  try {
    if (typeof XLSX === 'undefined') throw new Error('leitor de planilha indisponível');
    const wb = XLSX.read(await file.arrayBuffer(), { type: 'array', cellDates: true });
    const json = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: null });
    const nw = aggregateRows(json);
    if (!nw.M.length) { S.up = 'Não encontrei vendas com data válida nessa planilha.'; return; }
    // início do mês: se a base antiga guarda o 1º dia, compara; senão tolera início nos primeiros dias (domingo/feriado)
    const ruim = nw.M.filter(m => S.data.M.includes(m) && (nw.MN[m] || 1) > ((S.data.MN || {})[m] != null ? S.data.MN[m] : 7));
    if (ruim.length) { S.up = 'Essa planilha começa depois do que já está carregado em ' + ruim.map(m => mlabel(m) + ' (planilha começa no dia ' + nw.MN[m] + ')').join(', ') + '. Envie a exportação acumulada do mês (do primeiro dia até hoje) para não perder vendas já carregadas.'; return; }
    const aviso = nw.M.filter(m => (nw.MN[m] || 1) > 1).map(m => mlabel(m) + ' começa no dia ' + nw.MN[m]);
    const velha = nw.M.filter(m => S.data.M.includes(m) && (nw.D[m] || 0) < (S.data.D[m] || 0));
    if (velha.length) { S.up = 'Essa planilha é mais antiga que a base carregada (' + velha.map(m => mlabel(m) + ': planilha até dia ' + nw.D[m] + ', base até dia ' + S.data.D[m]).join('; ') + '). Envie a exportação mais recente.'; return; }
    const antes = S.data; S.data = mergeData(antes, nw); S.dirty = true;
    const novas = S.data.L.filter(l => !antes.L.includes(l));
    S.mk = S.data.M[S.data.M.length - 1];
    S.up = 'Base atualizada: ' + nw.M.map(m => mlabel(m) + ' até dia ' + nw.D[m]).join(' · ') + ' (' + json.length + ' linhas lidas).' + (novas.length ? ' Lojas novas: ' + novas.join(', ') + ' (defina a senha).' : '') + (Object.keys(nw.unmapped).filter(Boolean).length ? ' Tipos sem mapeamento ignorados: ' + Object.keys(nw.unmapped).join(', ') + '.' : '') + (aviso.length ? ' Aviso: ' + aviso.join('; ') + ' (sem vendas antes disso; confira se a exportação é do mês inteiro).' : '') + ' Publicando...'; render();
    const ok = await publicarAcesso();
    S.up = S.up.replace(' Publicando...', ok ? ' Publicado: gerentes e vendedores já veem a base nova.' : ' ATENÇÃO: não publicou no servidor. Toque em Publicar senhas e base.');
  } catch (e) { S.up = 'Não consegui ler a planilha: ' + e.message; }
}

    else { v = parseFloat(String(v).replace(',', '.')); S.sim[k] = isFinite(v) && v >= 0 ? v : 0; }
    render();
  }
  else if (t.dataset.p && editavel()) {
    const p = JSON.parse(t.dataset.p); let v = t.dataset.t === 'txt' ? t.value : parseFloat(String(t.value).replace(',', '.'));
    if (t.dataset.t !== 'txt') { if (!isFinite(v) || v < 0) v = 0; if (t.dataset.t === 'pct') v = v / 100; }
    if (p[0] === 'metas') metaW();
    if (p[0] === 'metas' && p[2] === 'lojaPct') v = v * 100;
    setPath(p, v); saveDono(); render();
  }
});

    if (I.role === 'dono') { try { const t = lsGet('cm2-cfg-dono'); if (t) { const d = JSON.parse(t); if (d.at > (I.cfgAt || 0)) S.cfg = mergeCfg(defaultCfg(), d.cfg); } } catch (e) { } }

  } catch (e) { $app.innerHTML = '<div class="wrap"><p class="note" style="padding:40px">Não consegui abrir: ' + esc(e && e.message || e) + '</p></div>'; }
