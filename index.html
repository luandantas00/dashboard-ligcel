<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Painel Comercial</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<script>try{document.documentElement.setAttribute("data-theme",localStorage.getItem("painel_tema")||"light")}catch(e){document.documentElement.setAttribute("data-theme","light")}</script>
<link rel="stylesheet" href="assets/shell.css?v=13">
</head>
<body>

<main id="telaLogin" class="login" hidden>
  <form id="formLogin" class="login-card" autocomplete="on">
    <div class="marca"><span class="bola"></span><span id="loginTitulo">Painel Comercial</span></div>
    <p class="sub">Entre com o seu e-mail e a senha que a sua liderança cadastrou.</p>
    <label for="lgEmail">E-mail</label>
    <input id="lgEmail" type="email" autocomplete="username" required inputmode="email">
    <label for="lgSenha">Senha</label>
    <input id="lgSenha" type="password" autocomplete="current-password" required>
    <button class="btn principal" id="btnEntrar" type="submit">Entrar</button>
    <p class="msg" id="lgMsg" role="alert"></p>
    <p class="dica">Esqueceu a senha? Peça a redefinição para quem cadastrou o seu acesso.</p>
  </form>
</main>

<main id="telaSenha" class="login" hidden>
  <form id="formSenha" class="login-card" autocomplete="off">
    <div class="marca"><span class="bola"></span><span>Crie a sua senha</span></div>
    <p class="sub">Bem-vindo! Escolha uma senha para os seus próximos acessos.</p>
    <label for="snSenha">Nova senha (mínimo 8 caracteres)</label>
    <input id="snSenha" type="password" autocomplete="new-password" minlength="8" required>
    <label for="snSenha2">Repita a senha</label>
    <input id="snSenha2" type="password" autocomplete="new-password" minlength="8" required>
    <button class="btn principal" id="btnSenha" type="submit">Salvar e entrar</button>
    <p class="msg" id="snMsg" role="alert"></p>
  </form>
</main>

<div id="telaApp" class="app" hidden>
  <header class="topo">
    <div class="topo-in">
      <button class="icone menu-btn" id="btnMenu" aria-label="Abrir o menu">☰</button>
      <div class="marca">
        <span class="bola"></span>
        <h1 id="tituloTxt">Painel Comercial</h1>
        <button class="icone" id="btnEditarTitulo" title="Alterar o título" aria-label="Alterar o título" hidden>✎</button>
        <form id="formTitulo" class="titulo-form" hidden>
          <input id="inpTitulo" maxlength="60" aria-label="Título">
          <button class="btn mini principal" type="submit">Salvar</button>
          <button class="btn mini" type="button" id="btnCancTitulo">Cancelar</button>
        </form>
      </div>
      <div class="quem">
        <span class="chip-user"><b id="uNome">—</b><small id="uPapel">—</small></span>
        <button class="btn mini tema" id="btnTema" title="Alternar entre visão clara e escura" aria-label="Alternar tema">☾ Escuro</button>
        <button class="btn mini" id="btnConta">Minha conta</button>
        <button class="btn mini" id="btnSair">Sair</button>
      </div>
    </div>
  </header>
  <div class="corpo-app">
    <aside id="menu" class="menu" aria-label="Menu">
      <div id="empBox" class="emp-box" hidden></div>
      <nav id="abas" class="abas" aria-label="Seções"></nav>
    </aside>
    <div id="menuVeu" class="veu" hidden></div>
    <section id="palco" class="palco"></section>
  </div>
</div>

<dialog id="dlgConta">
  <form method="dialog" id="formConta" class="dlg">
    <h2>Minha conta</h2>
    <p class="sub" id="contaInfo"></p>
    <label for="novaSenha">Nova senha (mínimo 8 caracteres)</label>
    <input id="novaSenha" type="password" autocomplete="new-password" minlength="8">
    <p class="msg" id="contaMsg" role="alert"></p>
    <div class="linha">
      <button class="btn principal" type="submit" id="btnSalvarSenha" value="ok">Trocar senha</button>
      <button class="btn" type="button" id="btnFecharConta">Fechar</button>
    </div>
  </form>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="assets/comissao-nucleo.js?v=5"></script>
<script src="assets/shell.js?v=14"></script>
</body>
</html>
